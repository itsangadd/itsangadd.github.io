<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to my website</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      background-color: #f4f4f4;
      color: #111111;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .viewport-frame {
      min-height: 100vh;
      width: 100%;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .sheet {
      width: 100%;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
    }

    .welcome-header {
      background-color: #f9f9f9;
      border-bottom: 1px solid #b5b5b5;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .app-icon-box {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #b68452 0%, #8c5c2d 55%, #6e451e 100%);
      border: 1px solid #5c3816;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon-text {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff8f0;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    .welcome-titles {
      min-width: 0;
    }

    .welcome-title {
      margin: 0 0 4px 0;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: #111111;
    }

    .welcome-tm {
      font-size: 13px;
      vertical-align: top;
      font-weight: 400;
    }

    .welcome-subtitle {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.25;
      color: #3a3a3a;
    }

    .welcome-subtitle-handle {
      font-weight: 600;
      color: #4f667a;
    }

    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #b5b5b5;
      background-color: #f7f7f7;
    }

    .split-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      height: 60px;
      min-height: 60px;
      color: #111111;
      text-decoration: none;
      background-color: #f7f7f7;
    }

    .split-cell:first-child {
      border-right: 1px solid #b5b5b5;
    }

    .split-cell:hover {
      background-color: #ececec;
    }

    .cell-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cell-label {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
      color: #111111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .badge svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .badge--twitter {
      background: linear-gradient(180deg, #4ec2f6 0%, #1da1f2 100%);
      color: #ffffff;
    }

    .badge--youtube {
      background: linear-gradient(180deg, #ff4e45 0%, #cc0000 100%);
      color: #ffffff;
    }

    .badge--telegram {
      background: linear-gradient(180deg, #37aee2 0%, #1e96c8 100%);
      color: #ffffff;
    }

    .badge--discord {
      background: linear-gradient(180deg, #7289da 0%, #5865f2 100%);
      color: #ffffff;
    }

    .badge--project {
      background: linear-gradient(180deg, #ececec 0%, #cfcfcf 100%);
      color: #3a3a3a;
    }

    .badge--green {
      background: linear-gradient(180deg, #63c757 0%, #3aa331 100%);
      color: #ffffff;
    }

    .badge--neutral {
      background: linear-gradient(180deg, #e7e7e7 0%, #cccccc 100%);
      color: #333333;
    }

    .chevron {
      width: 14px;
      height: 22px;
      flex-shrink: 0;
      color: #8c8c8c;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      min-height: 64px;
      border-bottom: 1px solid #b5b5b5;
      background-color: #f4f4f4;
      color: #111111;
      text-decoration: none;
    }

    .list-row--tinted {
      background-color: #e4f3df;
    }

    .list-row--plain {
      background-color: #f7f7f7;
    }

    .list-row:hover {
      background-color: #e8e8e8;
    }

    .list-row--tinted:hover {
      background-color: #d7ebd0;
    }

    .list-row-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .list-row-title {
      font-size: 21px;
      font-weight: 400;
      line-height: 1.2;
      color: #111111;
    }

    .list-row-desc {
      margin-left: auto;
      text-align: right;
      font-size: 14px;
      line-height: 1.25;
      color: #3a3a3a;
      flex-shrink: 0;
    }

    .list-row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .spacer-fill {
      flex: 1 1 auto;
      background-color: #f4f4f4;
      min-height: 36px;
    }

    @media (min-width: 768px) {
      .welcome-header {
        padding: 20px 22px;
      }

      .split-cell {
        padding: 14px 16px;
        height: 64px;
        min-height: 64px;
      }

      .list-row {
        padding: 14px 16px;
        min-height: 68px;
      }
    }

    @media (max-width: 520px) {
      .welcome-title {
        font-size: 22px;
      }

      .welcome-subtitle {
        font-size: 15px;
      }

      .cell-label,
      .list-row-title {
        font-size: 16px;
      }

      .list-row-desc {
        font-size: 12px;
      }
    }
  </style>
</head>
